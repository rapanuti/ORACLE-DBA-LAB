name: oracle-dba-lab

services:
  oracle:
    image: ${ORACLE_IMAGE:-gvenzl/oracle-free:23-slim-faststart}
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?Define ORACLE_PASSWORD en .env}
      APP_USER: ${LAB_DB_USER:-LAB}
      APP_USER_PASSWORD: ${LAB_DB_PASSWORD:?Define LAB_DB_PASSWORD en .env}
    ports:
      - "${ORACLE_PORT:-1521}:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./oracle/init:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 20s
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    environment:
      LAB_DB_HOST: oracle
      LAB_DB_PORT: "1521"
    depends_on:
      oracle:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  oracle-data:
